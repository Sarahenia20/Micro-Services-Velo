spring.datasource.url = jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/Velo
spring.datasource.username =${MYSQL_USER:root}
spring.datasource.password =${MYSQL_PASSWORD:root}

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# add these new properties
server.port=8081
### JPA / HIBERNATE ###
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
server.error.whitelabel.enabled=false

spring.application.name=association-service
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Changed from localhost to eureka-server for Docker environment
eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.preferIpAddress=true
eureka.instance.instanceId=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.leaseRenewalIntervalInSeconds=10
eureka.instance.leaseExpirationDurationInSeconds=30

# Added retry and timeout configurations
eureka.client.registry-fetch-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=15
ribbon.ReadTimeout=60000
ribbon.ConnectTimeout=60000

# Changed from localhost to keycloak service name (if you have it in Docker)
security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8180/auth/realms/gateway-service